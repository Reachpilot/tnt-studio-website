<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Animation — BlogPost.tsx</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top {
            padding: 12px 24px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .top button {
            background: #238636;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .top button:hover { background: #2ea043; }
        #editor {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #linenos {
            width: 70px;
            padding: 24px 16px;
            text-align: right;
            color: #484f58;
            background: #161b22;
            border-right: 1px solid #30363d;
            user-select: none;
            white-space: pre;
            overflow: hidden;
        }
        #code {
            flex: 1;
            padding: 24px 20px;
            white-space: pre;
            overflow: auto;
            outline: none;
        }
        .cursor {
            display: inline-block;
            width: 9px;
            height: 1.1em;
            background: #58a6ff;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 1; } 0%, 100% { opacity: 0; } }
        .kw { color: #ff7b72; }
        .str { color: #a5d6ff; }
        .num { color: #79c0ff; }
        .comment { color: #8b949e; }
        .tag { color: #7ee787; }
        .func { color: #d2a8ff; }
        .html-tag { color: #7ee787; }
    </style>
</head>
<body>
    <div class="top">
        <span>BlogPost.tsx — Typing Animation</span>
        <button id="startBtn">▶ Animation starten</button>
    </div>
    <div id="editor">
        <div id="linenos"></div>
        <pre id="code"><span class="cursor"></span></pre>
    </div>

    <script id="source" type="text/plain">
import { useParams, Link } from 'react-router-dom'
import { Helmet } from 'react-helmet-async'
import { blogPosts } from '../data/blog'

export default function BlogPost() {
  const { slug } = useParams<{ slug: string }>()
  const post = blogPosts.find((p) => p.slug === slug)

  const articleSchema = post
    ? JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'Article',
        headline: post.title,
        description: post.excerpt,
        author: {
          '@type': 'Person',
          name: post.author,
          affiliation: { '@type': 'Organization', name: 'TnT Studio' },
        },
        publisher: {
          '@type': 'Organization',
          name: 'TnT Studio',
          url: 'https://tnt-studio.de/',
        },
        datePublished: post.date,
        dateModified: post.date,
        mainEntityOfPage: {
          '@type': 'WebPage',
          '@id': `https://tnt-studio.de/blog/${post.slug}/`,
        },
      })
    : null

  if (!post) {
    return (
      <div className="flex min-h-screen items-center justify-center">
        <div className="text-center">
          <h1 className="text-4xl font-black text-neutral-900">404</h1>
          <p className="mt-4 text-neutral-500">Beitrag nicht gefunden.</p>
          <Link to="/blog/" className="mt-6 inline-block rounded-full bg-neutral-900 px-6 py-3 text-sm font-semibold text-white">
            Zum Blog
          </Link>
        </div>
      </div>
    )
  }

  const related = blogPosts.filter((p) => p.slug !== slug).slice(0, 2)
  const canonical = `https://tnt-studio.de/blog/${post.slug}/`

  return (
    <div className="pt-32 pb-24">
      <Helmet>
        <title>{`${post.title} — TnT Studio Blog`}</title>
        <meta name="description" content={post.excerpt} />
        <link rel="canonical" href={canonical} />
        <meta property="og:type" content="article" />
        <meta property="og:url" content={canonical} />
        <meta property="og:title" content={`${post.title} — TnT Studio Blog`} />
        <meta property="og:description" content={post.excerpt} />
        <meta name="twitter:title" content={`${post.title} — TnT Studio Blog`} />
        <meta name="twitter:description" content={post.excerpt} />
        <meta property="og:image" content="https://tnt-studio.de/og-image.webp" />
        <meta name="twitter:image" content="https://tnt-studio.de/og-image.webp" />
      </Helmet>
      {articleSchema && (
        <script
          type="application/ld+json"
          dangerouslySetInnerHTML={{ __html: articleSchema }}
        />
      )}
      <div className="mx-auto max-w-3xl px-6 lg:px-10">
        <Link to="/blog/" className="mb-8 inline-flex items-center gap-2 text-sm font-medium text-neutral-500 transition-colors hover:text-neutral-900">
          <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          Alle Beiträge
        </Link>

        <div className="mb-6 flex items-center gap-3">
          <span className="text-4xl">{post.emoji}</span>
          <span className="rounded-full bg-indigo-100 px-3 py-1 text-xs font-semibold text-indigo-700">
            {post.category}
          </span>
        </div>

        <h1 className="text-balance text-4xl font-black tracking-tight text-neutral-900 sm:text-5xl">
          {post.title}
        </h1>

        <div className="mt-6 flex items-center gap-4 text-sm text-neutral-400">
          <span className="font-medium text-neutral-700">{post.author}</span>
          <span>·</span>
          <span>{new Date(post.date).toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
          <span>·</span>
          <span>{post.readingTime} Lesezeit</span>
        </div>

        <p className="mt-8 text-xl leading-relaxed text-neutral-600 border-l-4 border-indigo-500 pl-6 italic">
          {post.excerpt}
        </p>

        <article className="mt-12 space-y-12">
          {post.sections.map((section, i) => (
            <div key={i}>
              <h2 className="mb-4 text-2xl font-bold tracking-tight text-neutral-900">
                {section.heading}
              </h2>
              {section.paragraphs.map((p, j) => (
                <p key={j} className="mb-4 text-base leading-relaxed text-neutral-600">
                  {p}
                </p>
              ))}
              {section.list && (
                <ul className="mt-4 space-y-3">
                  {section.list.map((item, k) => (
                    <li key={k} className="flex items-start gap-3 text-base text-neutral-600">
                      <svg className="mt-1 h-5 w-5 shrink-0 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                      {item}
                    </li>
                  ))}
                </ul>
              )}
            </div>
          ))}
        </article>

        {/* Author box */}
        <div className="mt-16 flex items-center gap-4 rounded-2xl border border-neutral-200 bg-white p-6">
          <div className="flex h-14 w-14 items-center justify-center rounded-full bg-neutral-900 text-lg font-bold text-white">
            {post.author.split(' ').map((n) => n[0]).join('')}
          </div>
          <div>
            <p className="font-bold text-neutral-900">{post.author}</p>
            <p className="text-sm text-neutral-500">
              {post.author === 'Tiago Esteves'
                ? 'Founder & CEO'
                : post.author === 'Theo Spingys'
                  ? 'Co-Founder & Marketing Lead'
                  : 'TnT Studio'} · Medienagentur · Wuppertal
            </p>
          </div>
        </div>

        {/* Related posts */}
        {related.length > 0 && (
          <div className="mt-16">
            <h3 className="mb-6 text-xl font-bold text-neutral-900">Weiterlesen</h3>
            <div className="grid gap-6 sm:grid-cols-2">
              {related.map((r) => (
                <Link
                  key={r.slug}
                  to={`/blog/${r.slug}/`}
                  className="group rounded-2xl border border-neutral-200 bg-white p-6 transition-all hover:shadow-lg"
                >
                  <div className="mb-3 flex items-center gap-2">
                    <span className="text-2xl">{r.emoji}</span>
                    <span className="text-xs font-semibold text-neutral-500">{r.category}</span>
                  </div>
                  <h4 className="text-base font-bold text-neutral-900 group-hover:text-indigo-600 transition-colors">
                    {r.title}
                  </h4>
                  <p className="mt-2 text-sm text-neutral-500">{r.readingTime} Lesezeit</p>
                </Link>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  )
}
    </script>

    <script>
        const source = document.getElementById('source').textContent.trim() + '\n';

        async function loadSource() {
            return source;
        }

        const editor = document.getElementById('code');
        const lineNos = document.getElementById('linenos');
        const startBtn = document.getElementById('startBtn');

        const KEYWORDS = new Set([
            'import','from','export','default','function','return','const','let','var',
            'if','else','for','while','switch','case','break','continue','try','catch',
            'finally','class','extends','new','this','typeof','interface','type','as',
            'await','async','true','false','null','undefined','yield','void'
        ]);

        function tokenize(line, out) {
            let i = 0;
            const n = line.length;
            while (i < n) {
                if ("\"'".includes(line[i])) {
                    const q = line[i];
                    let j = i + 1;
                    while (j < n && line[j] !== q) {
                        if (line[j] === '\\' && j + 1 < n) j += 2; else j++;
                    }
                    if (j < n) j++;
                    out.push(['str', line.substring(i, j)]);
                    i = j; continue;
                }
                if (line[i] === '/' && line[i+1] === '/') {
                    out.push(['comment', line.substring(i)]); break;
                }
                const num = line.slice(i).match(/^(\d+(\.\d+)?)/);
                if (num) { out.push(['num', num[0]]); i += num[0].length; continue; }
                const word = line.slice(i).match(/^([A-Za-z_][A-Za-z0-9_]*)/);
                if (word) {
                    const w = word[0];
                    out.push([KEYWORDS.has(w) ? 'kw' : 'text', w]);
                    i += w.length; continue;
                }
                if (line[i] === '<' && i + 1 < n && line[i+1] !== ' ' && line[i+1] !== '/') {
                    let j = i + 1;
                    while (j < n && !' />\n'.includes(line[j])) j++;
                    out.push(['text', '<']);
                    out.push(['html-tag', line.substring(i+1, j)]);
                    i = j; continue;
                }
                out.push(['text', line[i]]);
                i++;
            }
        }

        function span(cls, text) {
            const s = document.createElement('span');
            if (cls !== 'text') s.className = cls;
            s.textContent = text;
            return s;
        }

        let animating = false;
        let timeoutId = null;

        async function startAnimation() {
            if (animating) { location.reload(); return; }
            animating = true;
            startBtn.textContent = '↻ Neu starten';
            editor.innerHTML = '<span class="cursor"></span>';
            lineNos.textContent = '';

            const text = await loadSource();
            const lines = text.split('\n');
            const currentLineSpans = [];
            let lineIndex = 1;

            for (let li = 1; li <= lines.length; li++) {
                lineNos.textContent += li + '\n';
            }

            function typeChar(globalIdx) {
                // compute line/col
                let line = 1, col = 0, pos = 1;
                for (let i = 1; i <= lines.length; i++) {
                    const ln = lines[i-1];
                    if (globalIdx < pos + ln.length + 1) {
                        line = i;
                        col = Math.max(0, globalIdx - pos);
                        break;
                    }
                    pos += ln.length + 1;
                }
                // rebuild from scratch for highlighting
                const partial = text.slice(0, globalIdx);
                editor.innerHTML = '';
                const rendered = partial.split('\n');
                rendered.forEach((ln, idx) => {
                    if (idx > 1) editor.appendChild(document.createTextNode('\n'));
                    const tokens = [];
                    tokenize(ln, tokens);
                    tokens.forEach(([cls, t]) => editor.appendChild(span(cls, t)));
                });
                editor.appendChild(document.createElement('span')).className = 'cursor';
                // scroll
                editor.scrollTop = editor.scrollHeight;
            }

            let idx = 0;
            const SPEED = 12; // ms per char
            function step() {
                if (idx >= text.length) return;
                typeChar(idx);
                idx++;
                timeoutId = setTimeout(step, SPEED);
            }
            step();
        }

        startBtn.addEventListener('click', startAnimation);

        // Auto-start when showing for recording (press Space to start)
        window.addEventListener('keydown', e => { if (e.code === 'Space' && !animating) startAnimation(); });
    </script>
</body>
</html>
