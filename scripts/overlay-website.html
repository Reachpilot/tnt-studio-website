<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay — Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #00ff00; /* Chroma-Key-Hintergrund */
            font-family: 'Montserrat', sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .stage {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .word {
            font-size: 140px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            text-align: center;
            line-height: 0.95;
            color: #0096ff;
            animation: slideUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform: translateY(120%);
            opacity: 0;
            filter: drop-shadow(0 0 30px rgba(0,150,255,0.6));
        }
        .icon {
            font-size: 90px;
            margin-bottom: 24px;
            animation: slideUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform: translateY(120%);
            opacity: 0;
            filter: drop-shadow(0 0 20px rgba(0,150,255,0.5));
        }
        @keyframes slideUp {
            0% { transform: translateY(120%); opacity: 0; }
            25% { transform: translateY(0); opacity: 1; }
            70% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-140%); opacity: 1; }
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        button {
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #fff; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="replay">▶ Animation starten</button>
    </div>
    <div class="stage" id="stage">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div class="icon" id="icon">🌐</div>
            <div class="word" id="word">Website</div>
        </div>
    </div>

    <script>
        const word = document.getElementById('word');
        const icon = document.getElementById('icon');
        const btn = document.getElementById('replay');
        function play() {
            word.style.animation = 'none';
            icon.style.animation = 'none';
            void word.offsetWidth;
            word.style.animation = 'slideUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards';
            icon.style.animation = 'slideUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards';
        }
        btn.addEventListener('click', play);
        setTimeout(play, 500);
    </script>
</body>
</html>
