[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/leistungen/:slug"
  to = "/leistungen/:slug/"
  status = 301

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
