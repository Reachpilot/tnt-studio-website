[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/leistungen/content-creation"
  to = "/leistungen/social-media-marketing/"
  status = 301

[[redirects]]
  from = "/leistungen/content-creation/*"
  to = "/leistungen/social-media-marketing/"
  status = 301

[[redirects]]
  from = "/leistungen/produktfotografie"
  to = "/leistungen/web-design/"
  status = 301

[[redirects]]
  from = "/leistungen/produktfotografie/*"
  to = "/leistungen/web-design/"
  status = 301

[[redirects]]
  from = "/leistungen/branding"
  to = "/leistungen/web-design/"
  status = 301

[[redirects]]
  from = "/leistungen/branding/*"
  to = "/leistungen/web-design/"
  status = 301

[[redirects]]
  from = "/leistungen/:slug"
  to = "/leistungen/:slug/"
  status = 301

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/standorte/:slug"
  to = "/standorte/:slug/"
  status = 301

[[redirects]]
  from = "/standorte"
  to = "/standorte/"

[[redirects]]
  from = "/branchen/:slug"
  to = "/branchen/:slug/"
  status = 301

[[redirects]]
  from = "/branchen"
  to = "/branchen/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
