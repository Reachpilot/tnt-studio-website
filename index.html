<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="TnT Studio ist die Medienagentur in Wuppertal für Web Design, Social Media Marketing, Content Creation, Branding & Produktfotografie. Zwei Gründer, eine Vision: Marken, die Eindruck hinterlassen." />
    <meta name="keywords" content="Medienagentur Wuppertal, Webdesign Wuppertal, Webagentur Wuppertal, Social Media Agentur Wuppertal, Content Creation Wuppertal, Produktfotografie Wuppertal, Branding Agentur Wuppertal, Software Entwicklung Wuppertal, Online Marketing Wuppertal, Werbeagentur Wuppertal, SEO Agentur Wuppertal, Medienagentur NRW" />
    <meta name="author" content="TnT Studio" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <title>TnT Studio — Medienagentur Wuppertal | Web Design, Social Media & Content</title>
    <link rel="canonical" href="https://tnt-studio.de/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tnt-studio.de/" />
    <meta property="og:title" content="TnT Studio — Medienagentur Wuppertal" />
    <meta property="og:description" content="Wir bauen Marken, die Eindruck hinterlassen. Web Design, Marketing, Content Creation & Branding aus einer Hand." />
    <meta property="og:site_name" content="TnT Studio" />
    <meta property="og:image" content="https://tnt-studio.de/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TnT Studio — Medienagentur Wuppertal" />
    <meta name="twitter:description" content="Wir bauen Marken, die Eindruck hinterlassen. Web Design, Marketing, Content Creation & Branding aus einer Hand." />
    <meta name="twitter:image" content="https://tnt-studio.de/og-image.webp" />

    <!-- Preconnects -->
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:locale" content="de_DE" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Sitemap & RSS -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />


  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden Netlify form for static detection (mirror of React contact form) -->
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="url" name="website" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" />
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
